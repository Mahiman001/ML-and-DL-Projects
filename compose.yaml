services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000/predict
    volumes:
      - ./DATA/processed:/app/DATA/processed
    depends_on:
      - backend
    restart: unless-stopped
